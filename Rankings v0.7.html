<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Torneo modalidad Todos Contra Todos</title>
<style>
:root{
  --bg:#f3f3f3; --surface:#ffffff; --ink:#111111; --muted:#666666; --line:#c4c4c4;
  --accent:#111111; --accent-ink:#ffffff; --ball:#111111; --done:#e4e4e4;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){--bg:#0c0c0c;--surface:#171717;--ink:#f2f2f2;--muted:#999999;--line:#3a3a3a;--accent:#f2f2f2;--accent-ink:#111111;--ball:#f2f2f2;--done:#2a2a2a;color-scheme:dark}
}
:root[data-theme="dark"]{--bg:#0c0c0c;--surface:#171717;--ink:#f2f2f2;--muted:#999999;--line:#3a3a3a;--accent:#f2f2f2;--accent-ink:#111111;--ball:#f2f2f2;--done:#2a2a2a;color-scheme:dark}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Bahnschrift","Trebuchet MS","Segoe UI",system-ui,sans-serif;line-height:1.5}
main{max-width:900px;margin:0 auto;padding:20px 16px 48px}
h1{font-size:clamp(1.8rem,5vw,2.6rem);line-height:1.1;margin:8px 0 4px;letter-spacing:-.02em}
h1 span{display:inline-block;width:.55em;height:.55em;border-radius:50%;background:var(--ball);margin-left:.2em;vertical-align:.05em}
.lead{color:var(--muted);margin:0 0 20px}
section{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px;margin-bottom:14px}
h2{font-size:1.1rem;margin:0 0 4px}
.hint{color:var(--muted);font-size:.9rem;margin:0 0 10px}
textarea,input,select{width:100%;font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:9px 10px}
textarea{min-height:150px;resize:vertical;text-transform:capitalize}
textarea:focus,input:focus,select:focus,button:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.row{display:grid;grid-template-columns:1fr;gap:14px}
@media (max-width:620px){.row{grid-template-columns:1fr}}
button{font:inherit;font-weight:600;cursor:pointer;border:1px solid var(--accent);border-radius:6px;padding:11px 18px;background:var(--accent);color:var(--accent-ink)}
button.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.count{font-size:.85rem;color:var(--muted);margin-top:6px}
.error{color:#c0392b;font-weight:600;margin:10px 0 0}
.stats{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0 16px}
.tablewrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:.92rem}
th,td{padding:7px 8px;text-align:center;border-bottom:1px solid var(--line)}
th{font-size:.8rem;color:var(--muted);font-weight:600}
th.name,td.name{text-align:left}
td.name{font-weight:600}
tr.leader td{background:var(--done);font-weight:700}
.stat{border:1px solid var(--line);border-radius:6px;padding:6px 12px;font-size:.9rem}
.stat b{font-size:1.15rem;margin-right:4px}
.match{display:grid;grid-template-columns:5.5rem 1fr auto;align-items:center;gap:10px;border-bottom:1px solid var(--line);padding:8px 2px}
.match:last-child{border-bottom:0}
.num{font-weight:700;color:var(--accent);font-size:.9rem}
.vs b{font-weight:600}
.vs i{font-style:normal;color:var(--muted);margin:0 8px}
.score{display:flex;align-items:center;gap:6px 14px;color:var(--muted)}
.score input{width:2.8rem;text-align:center;padding:2px 2px}
.score select{width:auto;min-width:10rem}
.pick{background:transparent;color:inherit;border:1px solid var(--line);padding:5px 14px;font-weight:600}
.pick:hover{border-color:var(--ink)}
.pick.win{background:#1f7a45;border-color:#1f7a45;color:#ffffff}
.match.locked .pick{pointer-events:none}
.match.locked .pick:not(.win){opacity:.45}
.editbtn{background:transparent;color:var(--ink);border:1px solid var(--line);padding:4px 10px;font-size:1rem;line-height:1.2}
.score input.err{background:rgba(192,57,43,.22);border-color:#c0392b}
.score input:disabled{opacity:.7}
.score > button:not(.editbtn){padding:6px 14px;font-size:.9rem}
.msg{color:#c0392b;font-size:.85rem;flex-basis:100%}
.msg:empty{display:none}
.radios{display:flex;flex-direction:column;gap:8px}
.radios label{display:flex;align-items:center;gap:8px;cursor:pointer}
.radios input{width:auto;padding:0;accent-color:var(--accent)}
.score input[type=number]{-moz-appearance:textfield;appearance:textfield}
.score input[type=number]::-webkit-inner-spin-button,.score input[type=number]::-webkit-outer-spin-button{-webkit-appearance:none;margin:0}
.setbox{display:flex;align-items:center;gap:5px}
.setbox small{font-size:.75rem;margin-right:2px}
.match.multi{grid-template-columns:5.5rem 1fr}
.match.multi .score{grid-column:1/-1;flex-wrap:wrap}
@media (max-width:480px){.match{grid-template-columns:1fr auto}.num{grid-column:1/-1}.match.multi{grid-template-columns:1fr}}
.hero{position:relative;height:400px;border-radius:10px;overflow:hidden;margin:0 0 20px;background:#0c0c0c}
.hero img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center center}
.hero::after{content:"";position:absolute;inset:0;background:linear-gradient(to top,rgba(0,0,0,.78),rgba(0,0,0,0) 55%)}
.hero .txt{position:absolute;left:0;right:0;bottom:0;padding:22px;z-index:1;color:#ffffff}
.hero h1{margin:0 0 4px}
.hero .lead{color:#e2e2e2;margin:0}
</style>
</head>

<script>
const $ = id => document.getElementById(id);

function parseNames(){
  const seen = new Set(), list = [];
  $('names').value.split('\n').map(s => s.trim().replace(/(^|\s)(\S)/g, (_, sp, ch) => sp + ch.toLocaleUpperCase('es'))).filter(Boolean).forEach(n => {
    const k = n.toLowerCase();
    if(!seen.has(k)){ seen.add(k); list.push(n); }
  });
  return list;
}

$('names').addEventListener('input', () => {
  const n = parseNames().length;
  $('count').textContent = n + (n === 1 ? ' participante' : ' participantes');
});

// Método del círculo: cada ronda, nadie juega dos veces.
function roundRobin(players){
  const p = players.slice();
  if(p.length % 2) p.push(null);
  const n = p.length, rounds = [];
  for(let r = 0; r < n - 1; r++){
    const pairs = [];
    let bye = null;
    for(let i = 0; i < n / 2; i++){
      const a = p[i], b = p[n - 1 - i];
      if(a === null) bye = b; else if(b === null) bye = a; else pairs.push([a, b]);
    }
    rounds.push({pairs, bye});
    p.splice(1, 0, p.pop());
  }
  return rounds;
}

function el(tag, cls, text){
  const e = document.createElement(tag);
  if(cls) e.className = cls;
  if(text !== undefined) e.textContent = text;
  return e;
}

let state = {players: [], matches: [], mode: 'winner', sets: 1};

function renderTable(){
  const {players, matches, mode, sets} = state;
  const need = Math.floor(sets / 2) + 1;
  const full = mode !== 'winner';
  const stats = Object.create(null);
  const done = [];
  players.forEach(p => { stats[p] = {n: p, pj: 0, pg: 0, pp: 0, sf: 0, sc: 0, pf: 0, pc: 0, pts: 0}; });
  matches.forEach(m => {
    if(full && !m.final) return;
    let w = null;
    if(!full){ w = m.winner; }
    else {
      let wa = 0, wb = 0;
      const A = stats[m.a], B = stats[m.b];
      for(let k = 0; k < m.sets.length; k++){
        const s = m.sets[k];
        if(!s) continue;
        A.pf += s[0]; A.pc += s[1]; B.pf += s[1]; B.pc += s[0];
        if(s[0] > s[1]) wa++; else wb++;
        if(wa >= need || wb >= need) break;
      }
      A.sf += wa; A.sc += wb; B.sf += wb; B.sc += wa;
      if(wa >= need) w = m.a; else if(wb >= need) w = m.b;
    }
    if(w){
      const W = stats[w], L = stats[w === m.a ? m.b : m.a];
      W.pj++; L.pj++; W.pg++; L.pp++; W.pts += 2; L.pts += 1;
      done.push({a: m.a, b: m.b, w});
    }
  });
  const base = (x, y) => (y.sf - y.sc) - (x.sf - x.sc) || (y.pf - y.pc) - (x.pf - x.pc) || x.n.localeCompare(y.n, 'es');
  const sorted = Object.values(stats).sort((x, y) => y.pts - x.pts);
  const rows = [];
  for(let i = 0; i < sorted.length;){
    let j = i;
    while(j < sorted.length && sorted[j].pts === sorted[i].pts) j++;
    const grp = sorted.slice(i, j);
    if(grp.length > 1){
      const names = new Set(grp.map(g => g.n));
      grp.forEach(g => { g.h2h = 0; });
      done.forEach(r => { if(names.has(r.a) && names.has(r.b)) stats[r.w].h2h++; });
      grp.sort((x, y) => y.h2h - x.h2h || base(x, y));
    }
    rows.push(...grp);
    i = j;
  }
  const cols = [['pos', '#', 'Posición'], ['n', 'Jugador', ''], ['pj', 'PJ', 'Partidos jugados'], ['pg', 'PG', 'Partidos ganados'], ['pp', 'PP', 'Partidos perdidos']];
  if(full) cols.push(['sf', 'SF', 'Sets a favor'], ['sc', 'SC', 'Sets en contra']);
  cols.push(['pts', 'Pts', 'Puntos de la tabla']);
  const tbl = document.createElement('table');
  const hr = tbl.createTHead().insertRow();
  cols.forEach(([k, h, t]) => {
    const th = document.createElement('th');
    th.textContent = h; if(t) th.title = t; if(k === 'n') th.className = 'name';
    hr.append(th);
  });
  const all = matches.length > 0 && done.length === matches.length;
  const medals = ['🥇', '🥈', '🥉'];
  const body = tbl.createTBody();
  rows.forEach((r, i) => {
    const tr = body.insertRow();
    if(i === 0 && r.pts > 0) tr.className = 'leader';
    cols.forEach(([k]) => {
      const td = tr.insertCell();
      td.textContent = k === 'pos' ? i + 1 : (k === 'n' && all && i < 3 ? r.n + ' ' + medals[i] : r[k]);
      if(k === 'n') td.className = 'name';
    });
  });
  $('table').textContent = '';
  $('table').append(tbl);
  $('legend').textContent = full
    ? 'PJ jugados, PG ganados, PP perdidos, SF y SC sets a favor y en contra. Pts: 2 por victoria y 1 por derrota. Desempate: resultado del partido entre los empatados, luego diferencia de sets y de puntos.'
    : 'PJ jugados, PG ganados, PP perdidos. Pts: 2 por victoria y 1 por derrota. Desempate: resultado del partido entre los empatados.';
}

function generate(){
  $('err').textContent = '';
  const players = parseNames();
  const sets = parseInt(document.querySelector('input[name=sets]:checked').value, 10);
  const mode = document.querySelector('input[name=mode]:checked').value;
  if(players.length < 2){ $('err').textContent = 'Ingresa al menos 2 participantes.'; return; }

  const rounds = roundRobin(players);
  state = {players, matches: [], mode, sets};
  const box = $('schedule'); box.innerHTML = '';
  let total = 0;

  rounds.forEach(rd => {
    rd.pairs.forEach(pr => {
      total++;
      const st = {a: pr[0], b: pr[1], winner: null, sets: []};
      state.matches.push(st);
      const m = el('div', 'match');
      m.append(el('span', 'num', 'Partido ' + total));
      const vs = el('span', 'vs');
      vs.append(el('b', '', pr[0]), el('i', '', 'vs'), el('b', '', pr[1]));
      const sc = el('div', 'score');
      if(mode === 'winner'){
        vs.textContent = '';
        const picks = [pr[0], pr[1]].map(nm => { const b = el('button', 'pick', nm); b.type = 'button'; return b; });
        const ed = el('button', 'editbtn', '✎');
        ed.type = 'button'; ed.hidden = true;
        ed.title = 'Modificar ganador';
        ed.setAttribute('aria-label', 'Modificar ganador del partido ' + total);
        picks.forEach(b => b.addEventListener('click', () => {
          if(m.classList.contains('locked')) return;
          b.classList.add('win'); m.classList.add('locked'); ed.hidden = false;
          st.winner = b.textContent; renderTable();
        }));
        ed.addEventListener('click', () => {
          m.classList.remove('locked'); ed.hidden = true;
          picks.forEach(x => x.classList.remove('win'));
          st.winner = null; renderTable();
        });
        vs.append(picks[0], el('i', '', 'vs'), picks[1]);
        sc.append(ed);
      } else {
        m.classList.add('multi');
        const boxes = [];
        const msg = el('span', 'msg');
        for(let s = 1; s <= sets; s++){
          const box2 = el('div', 'setbox');
          if(sets > 1) box2.append(el('small', '', 'Set ' + s));
          const pair = [];
          [pr[0], pr[1]].forEach((nm, idx) => {
            const inp = document.createElement('input');
            inp.type = 'number'; inp.min = '0'; inp.inputMode = 'numeric';
            inp.setAttribute('aria-label', 'Set ' + s + ', puntaje de ' + nm);
            inp.addEventListener('input', () => { msg.textContent = ''; check(); renderTable(); });
            pair.push(inp);
            box2.append(inp);
            if(idx === 0) box2.append('-');
          });
          boxes.push(pair);
          sc.append(box2);
        }
        // Un set es válido si alguien llega a 11 o más y hay 2 puntos de diferencia como mínimo.
        const check = () => {
          let bad = false;
          boxes.forEach(([a, b], k) => {
            let valid = null, err = false;
            if(a.value !== '' && b.value !== ''){
              const p = Number(a.value), q = Number(b.value);
              err = Math.max(p, q) < 11 || Math.abs(p - q) < 2 || (Math.max(p, q) > 11 && Math.abs(p - q) !== 2);
              if(!err) valid = [p, q];
            }
            a.classList.toggle('err', err); b.classList.toggle('err', err);
            st.sets[k] = valid;
            if(err) bad = true;
          });
          return bad;
        };
        const save = el('button', '', 'Ingresar puntajes');
        save.type = 'button';
        const ed = el('button', 'editbtn', '✎');
        ed.type = 'button'; ed.hidden = true;
        ed.title = 'Editar puntajes';
        ed.setAttribute('aria-label', 'Editar puntajes del partido ' + total);
        const setLocked = on => {
          boxes.forEach(p => p.forEach(i => { i.disabled = on; }));
          save.hidden = on; ed.hidden = !on;
          m.classList.toggle('locked', on);
          st.final = on;
          renderTable();
        };
        save.addEventListener('click', () => {
          if(check()){ msg.textContent = 'Hay marcadores con error (en rojo).'; return; }
          if(boxes.some(([a, b]) => (a.value === '') !== (b.value === ''))){ msg.textContent = 'Completa los dos puntajes de cada set.'; return; }
          const need = Math.floor(sets / 2) + 1;
          let wa = 0, wb = 0;
          for(const s of st.sets){
            if(!s) continue;
            if(s[0] > s[1]) wa++; else wb++;
            if(wa >= need || wb >= need) break;
          }
          if(wa < need && wb < need){ msg.textContent = 'Faltan sets para definir al ganador.'; return; }
          msg.textContent = '';
          setLocked(true);
        });
        ed.addEventListener('click', () => setLocked(false));
        sc.append(save, ed, msg);
      }
      m.append(vs, sc);
      box.append(m);
    });
  });

  const s = $('summary'); s.innerHTML = '';
  s.className = 'stats';
  [[players.length, 'jugadores'], [total, 'partidos'], [rounds.length, 'rondas'], [sets, sets === 1 ? 'set por partido' : 'sets por partido']]
    .forEach(([n, t]) => { const d = el('div', 'stat'); d.append(el('b', '', String(n)), t); s.append(d); });

  renderTable();
  $('out').hidden = false;
  $('out').scrollIntoView({behavior: 'smooth', block: 'start'});
}

$('go').addEventListener('click', generate);
</script>
</body>
</html>
